[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codescan"
dynamic = ["version"]
description = "Scan Python code into a Neo4j graph and explore it over MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.3.0,<3.0.0",
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]

[project.scripts]
codescan = "scanner:main"
codescan-mcp = "codescan_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.10",
]

[tool.setuptools]
py-modules = ["scanner", "codescan_mcp_server"]

[tool.setuptools.packages.find]
include = ["codescan_lib*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }
